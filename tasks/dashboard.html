<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirs of Traea — Project Planner</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eee;
    --text-dim: #8899aa;
    --green: #4ecca3;
    --yellow: #f0c040;
    --red: #e94560;
    --blue: #4ea8de;
    --orange: #f08c00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 1.6em; margin-bottom: 4px; color: var(--accent); }
  .subtitle { color: var(--text-dim); font-size: 0.85em; margin-bottom: 24px; }

  /* Health Banner */
  .health-banner { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .health-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
    min-width: 140px;
    border-left: 4px solid var(--accent2);
  }
  .health-card.green { border-left-color: var(--green); }
  .health-card.yellow { border-left-color: var(--yellow); }
  .health-card.red { border-left-color: var(--red); }
  .health-card .label { font-size: 0.75em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .health-card .value { font-size: 1.8em; font-weight: 700; margin: 4px 0; }
  .health-card .detail { font-size: 0.8em; color: var(--text-dim); }

  /* Progress Bar */
  .progress-bar { background: var(--bg); border-radius: 6px; height: 8px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; transition: width 0.3s ease; }
  .progress-fill.green { background: var(--green); }
  .progress-fill.yellow { background: var(--yellow); }
  .progress-fill.red { background: var(--red); }
  .progress-fill.blue { background: var(--blue); }
  .progress-fill.orange { background: var(--orange); }

  /* Sections */
  .section { background: var(--surface); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .section-header {
    padding: 14px 20px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none; background: var(--surface2);
    font-weight: 600; font-size: 0.95em;
  }
  .section-header:hover { background: #1a4a7a; }
  .section-header .arrow { transition: transform 0.2s; font-size: 0.8em; color: var(--text-dim); }
  .section-header .arrow.collapsed { transform: rotate(-90deg); }
  .section-header .badge {
    background: var(--accent); color: white; border-radius: 10px;
    padding: 2px 8px; font-size: 0.75em; margin-left: 8px; font-weight: 400;
  }
  .section-body { padding: 16px 20px; transition: max-height 0.3s ease; }
  .section-body.collapsed { display: none; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th { text-align: left; padding: 8px 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 0.75em; letter-spacing: 0.5px; border-bottom: 1px solid #2a2a4e; }
  td { padding: 8px 12px; border-bottom: 1px solid #1a1a3e; }
  tr:hover td { background: rgba(255,255,255,0.03); }

  /* Status Pills */
  .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 500; }
  .pill.playable, .pill.done { background: rgba(78,204,163,0.2); color: var(--green); }
  .pill.partial, .pill.in-progress { background: rgba(78,168,222,0.2); color: var(--blue); }
  .pill.not-started { background: rgba(233,69,96,0.15); color: var(--red); }
  .pill.blocked { background: rgba(233,69,96,0.2); color: var(--red); }
  .pill.pending { background: rgba(240,192,64,0.2); color: var(--yellow); }

  /* Decision Cards */
  .decision-card { background: var(--bg); border: 1px solid var(--yellow); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .decision-card .q { font-weight: 600; margin-bottom: 4px; }
  .decision-card .context { font-size: 0.8em; color: var(--text-dim); }

  /* Sprint / list Items */
  .sprint-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #1a1a3e; }
  .sprint-item:last-child { border-bottom: none; }
  .sprint-rank {
    width: 28px; height: 28px; background: var(--surface2); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85em; color: var(--accent); flex-shrink: 0;
  }
  .sprint-agent { font-size: 0.75em; color: var(--accent2); background: rgba(83,52,131,0.2); padding: 1px 8px; border-radius: 8px; white-space: nowrap; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--bg); border: 1px solid #2a2a4e; color: var(--text-dim);
    padding: 4px 12px; border-radius: 16px; cursor: pointer; font-size: 0.8em; transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--text); background: rgba(233,69,96,0.1); }

  /* Timestamps */
  .timestamp { font-size: 0.75em; color: var(--text-dim); }

  /* ── Roadmap ────────────────────────────────────────────────── */
  .roadmap { display: flex; flex-direction: column; gap: 12px; }
  .milestone-card {
    background: var(--bg);
    border: 1px solid #2a2a4e;
    border-radius: 8px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
  }
  .milestone-card.current { border-color: var(--accent); border-width: 2px; }
  .milestone-card.completed { border-color: var(--green); opacity: 0.7; }
  .milestone-num {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1em; flex-shrink: 0;
    background: var(--surface2); color: var(--text-dim);
  }
  .milestone-card.current .milestone-num { background: var(--accent); color: #fff; }
  .milestone-card.completed .milestone-num { background: var(--green); color: #fff; }
  .milestone-info { flex: 1; min-width: 0; }
  .milestone-name { font-weight: 700; font-size: 0.95em; }
  .milestone-sub { font-size: 0.8em; color: var(--text-dim); margin-top: 2px; }
  .milestone-items { font-size: 0.75em; color: var(--text-dim); margin-top: 4px; }
  .milestone-right { text-align: right; flex-shrink: 0; min-width: 80px; }
  .milestone-pct { font-size: 1.2em; font-weight: 700; }
  .milestone-target { font-size: 0.7em; color: var(--text-dim); }

  /* ── Backlog ────────────────────────────────────────────────── */
  .backlog-group { margin-bottom: 16px; }
  .backlog-group-header {
    font-weight: 600; font-size: 0.9em; padding: 8px 0 6px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--blue);
  }
  .backlog-task {
    display: flex; align-items: center; gap: 10px; padding: 5px 0;
    font-size: 0.85em; border-bottom: 1px solid #1a1a3e;
  }
  .backlog-task:last-child { border-bottom: none; }
  .backlog-task .pill { font-size: 0.7em; min-width: 70px; text-align: center; }
  .backlog-task-name { flex: 1; }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .health-banner { flex-direction: column; }
    .health-card { min-width: unset; }
    .milestone-card { flex-wrap: wrap; }
    .milestone-right { text-align: left; min-width: unset; }
  }
</style>

  ]
};

// ============================================================
// Render Logic
// ============================================================

function render() {
  const D = PLANNER_DATA;
  document.getElementById('lastUpdated').textContent = D.lastUpdated;

  // Health Banner
  const hb = document.getElementById('healthBanner');
  const overallColor = D.health.overall === 'On Track' ? 'green' : D.health.overall === 'At Risk' ? 'yellow' : 'red';
  const fa = D.health.factionsPlayable;
  const ms = D.health.milestoneProgress;
  const bugs = D.health.knownBugs;
  hb.innerHTML = `
    <div class="health-card ${overallColor}">
      <div class="label">Overall</div>
      <div class="value">${D.health.overall}</div>
    </div>
    <div class="health-card ${fa.done >= 7 ? 'green' : fa.done >= 4 ? 'yellow' : 'red'}">
      <div class="label">${fa.label}</div>
      <div class="value">${fa.done}/${fa.total}</div>
      <div class="progress-bar"><div class="progress-fill ${fa.done >= 7 ? 'green' : fa.done >= 4 ? 'yellow' : 'red'}" style="width:${fa.done/fa.total*100}%"></div></div>
    </div>
    <div class="health-card yellow">
      <div class="label">${ms.label}</div>
      <div class="value">${ms.done}/${ms.total}</div>
      <div class="detail">${ms.detail}</div>
    </div>
    <div class="health-card ${bugs.blockers === 0 ? 'green' : 'red'}">
      <div class="label">${bugs.label}</div>
      <div class="value">${bugs.total}</div>
      <div class="detail">${bugs.blockers} blocker${bugs.blockers !== 1 ? 's' : ''}</div>
    </div>
  `;

  const container = document.getElementById('sections');
  container.innerHTML = '';

  // ── Roadmap ──
  container.appendChild(buildSection('Roadmap', '', () => {
    return `<div class="roadmap">${D.roadmap.map((m, i) => {
      const cls = m.status === 'in-progress' ? 'current' : m.progress >= 100 ? 'completed' : '';
      const pctColor = m.progress >= 80 ? 'green' : m.progress >= 30 ? 'yellow' : m.progress > 0 ? 'orange' : 'red';
      return `
        <div class="milestone-card ${cls}">
          <div class="milestone-num">${i + 1}</div>
          <div class="milestone-info">
            <div class="milestone-name">${m.name} <span style="color:var(--text-dim);font-weight:400;font-size:0.85em">— ${m.subtitle}</span></div>
            <div class="milestone-items">${m.items.join(' · ')}</div>
            <div class="progress-bar" style="margin-top:6px"><div class="progress-fill ${pctColor}" style="width:${m.progress}%"></div></div>
          </div>
          <div class="milestone-right">
            <div class="milestone-pct" style="color:var(--${pctColor})">${m.progress}%</div>
            <div class="milestone-target">${m.targetDate}</div>
          </div>
        </div>`;
    }).join('')}</div>`;
  }));

  // ── Current Sprint ──
  const sp = D.currentSprint;
  const spMilestone = D.roadmap.find(m => m.id === sp.milestone);
  container.appendChild(buildSection(`Current Sprint — ${spMilestone ? spMilestone.name : sp.milestone}`, '', () => {
    return `<p style="color:var(--text-dim);font-size:0.85em;margin-bottom:12px"><strong>Goal:</strong> ${sp.goal}</p>` +
      sp.tasks.map((t, i) => `
        <div class="sprint-item">
          <div class="sprint-rank">${i + 1}</div>
          <div style="flex:1">${t.task}</div>
          <span class="pill ${t.status}">${t.status.replace('-', ' ')}</span>
          <span class="sprint-agent">${t.agent}</span>
        </div>
      `).join('');
  }));

  // ── Decisions Pending ──
  if (D.decisions.length > 0) {
    container.appendChild(buildSection('Decisions Pending', `<span class="badge">${D.decisions.length}</span>`, () => {
      return D.decisions.map(d => `
        <div class="decision-card">
          <div class="q">${d.question}</div>
          <div class="context">${d.context}</div>
        </div>
      `).join('');
    }));
  }

  // ── Backlog ──
  container.appendChild(buildSection('Backlog', `<span class="badge">${D.backlog.reduce((s, g) => s + g.tasks.length, 0)} tasks</span>`, () => {
    return `
      <div class="filter-bar">
        <button class="filter-btn active" data-bfilter="all">All</button>
        <button class="filter-btn" data-bfilter="pending">Pending</button>
        <button class="filter-btn" data-bfilter="blocked">Blocked</button>
        <button class="filter-btn" data-bfilter="not-started">Not Started</button>
        <button class="filter-btn" data-bfilter="done">Done</button>
      </div>` +
      D.backlog.map(g => `
        <div class="backlog-group">
          <div class="backlog-group-header">${g.name} <span style="color:var(--text-dim);font-weight:400">(${g.tasks.filter(t=>t.status==='done').length}/${g.tasks.length})</span></div>
          ${g.tasks.map(t => `
            <div class="backlog-task" data-bstatus="${t.status}">
              <span class="pill ${t.status}">${t.status === 'not-started' ? 'todo' : t.status}</span>
              <span class="backlog-task-name${t.status === 'done' ? '" style="text-decoration:line-through;color:var(--text-dim)' : ''}">${t.task}</span>
              <span class="sprint-agent">${t.agent}</span>
            </div>
          `).join('')}
        </div>
      `).join('');
  }, () => {
    document.querySelectorAll('[data-bfilter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-bfilter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.bfilter;
        document.querySelectorAll('.backlog-task').forEach(row => {
          row.style.display = (f === 'all' || row.dataset.bstatus === f) ? '' : 'none';
        });
      });
    });
  }));

  // ── Faction Readiness ──
  container.appendChild(buildSection('Faction Readiness', '', () => {
    const filterHtml = `
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="playable">Playable</button>
        <button class="filter-btn" data-filter="partial">Partial</button>
        <button class="filter-btn" data-filter="not-started">Not Started</button>
      </div>`;
    const tableHtml = `<table id="factionTable">
      <tr><th>Faction</th><th>Units</th><th>Abilities</th><th>Tested</th><th>Status</th></tr>
      ${D.factions.map(f => `
        <tr data-status="${f.status}">
          <td style="font-weight:600">${f.name}</td>
          <td>${f.units}</td>
          <td>${f.abilities}</td>
          <td>${f.tested}</td>
          <td><span class="pill ${f.status}">${f.status.replace('-', ' ')}</span></td>
        </tr>
      `).join('')}
    </table>`;
    return filterHtml + tableHtml;
  }, () => {
    document.querySelectorAll('#factionTable').forEach(() => {
      document.querySelectorAll('.filter-bar .filter-btn[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          document.querySelectorAll('#factionTable tr[data-status]').forEach(row => {
            row.style.display = (filter === 'all' || row.dataset.status === filter) ? '' : 'none';
          });
        });
      });
    });
  }));

  // ── Blocked ──
  if (D.blocked.length > 0) {
    container.appendChild(buildSection('Blocked Items', `<span class="badge" style="background:var(--red)">${D.blocked.length}</span>`, () => {
      return `<table>
        <tr><th>Task</th><th>Blocked By</th><th>Milestone</th></tr>
        ${D.blocked.map(b => `
          <tr>
            <td>${b.task}</td>
            <td style="color:var(--text-dim)">${b.blockedBy}</td>
            <td><span class="pill in-progress">${b.milestone}</span></td>
          </tr>
        `).join('')}
      </table>`;
    }));
  }

  // ── Recently Completed ──
  container.appendChild(buildSection('Recently Completed', '', () => {
    return D.recentlyCompleted.map(a => `
      <div class="sprint-item">
        <span class="timestamp" style="min-width:80px">${a.date}</span>
        <div style="flex:1">${a.item}</div>
        <span class="sprint-agent">${a.agent}</span>
      </div>
    `).join('');
  }));
}

function buildSection(title, headerExtra, contentFn, postRenderFn) {
  const section = document.createElement('div');
  section.className = 'section';
  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `<span>${title}${headerExtra || ''}</span><span class="arrow">&#9660;</span>`;
  const body = document.createElement('div');
  body.className = 'section-body';
  body.innerHTML = contentFn();
  header.addEventListener('click', () => {
    body.classList.toggle('collapsed');
    header.querySelector('.arrow').classList.toggle('collapsed');
  });
  section.appendChild(header);
  section.appendChild(body);
  if (postRenderFn) requestAnimationFrame(() => postRenderFn());
  return section;
}

render();
</script>
</body>
</html>
